[package]
name = "idv-asas-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-stream = "0.3"

[profile.release]
opt-level = 2
