[package]
name = "idv-asas"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "x11", "links"] }
egui = "0.36"
epaint = "0.36"
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2
